<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpiar Datos Panel Fodor</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #1e293b;
            color: #e2e8f0;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #0f172a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 20px 0;
            color: #4ade80;
        }
        .status {
            font-size: 14px;
            margin: 15px 0;
            padding: 12px;
            border-radius: 8px;
            background: #1e293b;
        }
        .success {
            background: #14532d;
            color: #4ade80;
            border-left: 4px solid #4ade80;
        }
        .info {
            background: #1e3a5f;
            color: #60a5fa;
            border-left: 4px solid #60a5fa;
        }
        .warning {
            background: #7c2d12;
            color: #fb923c;
            border-left: 4px solid #fb923c;
        }
        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 700;
            background: #4ade80;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #22c55e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpieza de Datos Panel Fodor</h1>
        <div id="log"></div>
        <button onclick="location.href='about:blank'">Cerrar</button>
    </div>

    <script>
        const log = document.getElementById('log');

        function agregar(texto, tipo = 'info') {
            const div = document.createElement('div');
            div.className = `status ${tipo}`;
            div.textContent = texto;
            log.appendChild(div);
            console.log(texto);
        }

        function limpiar() {
            agregar('🔄 Iniciando limpieza...', 'info');

            // 1. Limpiar localStorage
            try {
                const keys = Object.keys(localStorage);
                keys.forEach(key => localStorage.removeItem(key));
                agregar(`✅ localStorage limpiado (${keys.length} claves eliminadas)`, 'success');
            } catch(e) {
                agregar(`⚠️ Error limpiando localStorage: ${e.message}`, 'warning');
            }

            // 2. Limpiar SessionStorage
            try {
                const keys = Object.keys(sessionStorage);
                keys.forEach(key => sessionStorage.removeItem(key));
                agregar(`✅ sessionStorage limpiado (${keys.length} claves eliminadas)`, 'success');
            } catch(e) {
                agregar(`⚠️ Error limpiando sessionStorage: ${e.message}`, 'warning');
            }

            // 3. Limpiar IndexedDB
            try {
                const dbs = await indexedDB.databases();
                let count = 0;
                for (const db of dbs) {
                    indexedDB.deleteDatabase(db.name);
                    count++;
                }
                agregar(`✅ IndexedDB limpiado (${count} bases de datos eliminadas)`, 'success');
            } catch(e) {
                agregar(`⚠️ Error limpiando IndexedDB: ${e.message}`, 'warning');
            }

            // 4. Limpiar cookies
            try {
                document.cookie.split(";").forEach(function(c) {
                    const eqPos = c.indexOf("=");
                    const name = eqPos > -1 ? c.substr(0, eqPos).trim() : c.trim();
                    document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                });
                agregar('✅ Cookies limpiadas', 'success');
            } catch(e) {
                agregar(`⚠️ Error limpiando cookies: ${e.message}`, 'warning');
            }

            agregar('✅ LIMPIEZA COMPLETADA', 'success');
            agregar('Ahora abre el Panel normalmente. Estará como nuevo.', 'info');
        }

        // Ejecutar limpieza
        limpiar();
    </script>
</body>
</html>
